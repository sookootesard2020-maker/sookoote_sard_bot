name: Telegram Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"
      timezone: "Asia/Tehran"
    - cron: "0 9 * * *"
      timezone: "Asia/Tehran"
    - cron: "0 14 * * *"
      timezone: "Asia/Tehran"
    - cron: "0 17 * * *"
      timezone: "Asia/Tehran"
    - cron: "30 19 * * *"
      timezone: "Asia/Tehran"

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
