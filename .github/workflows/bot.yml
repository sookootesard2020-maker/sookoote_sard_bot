name: Telegram Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "30 5 * * *"
      timezone: "Asia/Tehran"

    - cron: "30 9 * * *"
      timezone: "Asia/Tehran"

    - cron: "30 14 * * *"
      timezone: "Asia/Tehran"

    - cron: "30 17 * * *"
      timezone: "Asia/Tehran"

    - cron: "0 20 * * *"
      timezone: "Asia/Tehran"

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Morning post
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 5 * * *'
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          POST_HOUR: "8"

      - name: Noon post
        if: github.event_name == 'schedule' && github.event.schedule == '30 9 * * *'
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          POST_HOUR: "12"

      - name: Afternoon post
        if: github.event_name == 'schedule' && github.event.schedule == '30 14 * * *'
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          POST_HOUR: "17"

      - name: Evening post
        if: github.event_name == 'schedule' && github.event.schedule == '30 17 * * *'
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          POST_HOUR: "20"

      - name: Night post
        if: github.event_name == 'schedule' && github.event.schedule == '0 20 * * *'
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          POST_HOUR: "23"
